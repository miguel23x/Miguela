<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Un pequeño universo para YULI</title>
<style>
:root{--gold:#ffd65a;--cream:#fff4c6;--ink:#03040b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a;color:white;font-family:Georgia,"Times New Roman",serif}
canvas{display:block}
#intro{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle at 50% 48%,#172044 0%,#070b1c 43%,#010207 100%);transition:opacity 1.4s ease}
.intro-content{text-align:center;padding:30px;max-width:720px}
.kicker{font:600 11px/1.5 Arial,sans-serif;letter-spacing:7px;text-transform:uppercase;color:#d9c98b;margin-bottom:24px}
h1{font-size:clamp(45px,8vw,104px);font-weight:400;letter-spacing:8px;margin:0;color:#fff6d2;text-shadow:0 0 35px #ffd86b33}
.subtitle{margin:22px 0 34px;font:12px/2 Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#c6c9dc}
#enter{border:1px solid #d9b85c99;background:#ffffff08;color:#fff1b5;border-radius:999px;padding:16px 30px;letter-spacing:4px;font:11px Arial,sans-serif;cursor:pointer;transition:.3s}
#enter:hover{background:#ffd65a18;box-shadow:0 0 35px #ffd65a33;transform:translateY(-2px)}
#loading{margin-top:22px;font:10px Arial,sans-serif;letter-spacing:3px;color:#8e94b3;opacity:.8}
#hud{position:fixed;inset:0;z-index:3;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:30px 34px;opacity:0;transition:opacity 1.5s}
.hud-top,.hud-bottom{display:flex;justify-content:space-between;align-items:center;font:10px Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#d5d8e9}
.hud-top strong{font-weight:500;color:#ffe9a0}
.hud-bottom{letter-spacing:3px;color:#9298b6}
#message{position:fixed;z-index:4;left:50%;bottom:11%;transform:translateX(-50%);text-align:center;opacity:0;pointer-events:none;transition:opacity 1.6s;width:90%}
#message h2{font-weight:400;letter-spacing:7px;font-size:clamp(25px,4vw,54px);margin:0;color:#fff0b4;text-shadow:0 0 25px #ffc83d55}
#message p{font:10px Arial,sans-serif;letter-spacing:4px;color:#c6c9dc;margin-top:14px}
#hint{position:fixed;right:30px;bottom:30px;z-index:5;opacity:0;font:10px Arial,sans-serif;letter-spacing:2px;color:#aeb4ce;transition:opacity 1s}
</style>
</head>
<body>
<audio id="musicaFondo" loop preload="auto">
  <source src="musica.mp3.mp3" type="audio/mpeg">
</audio>
<div id="intro">
  <div class="intro-content">
    <button id="enter">TOCA PARA ENTRAR</button>
  </div>
</div>

<div id="hud">
  <div class="hud-top"><strong>PARA YULI</strong></div>
</div>
<div id="message"><h2>FELIZ DÍA, YULI ✨</h2></div>


<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const $ = id => document.getElementById(id);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x03040c,0.0028);

const camera = new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,2500);
camera.position.set(0,5.5,38);

const renderer = new THREE.WebGLRenderer({antialias:true,alpha:false,precision:"highp"});
renderer.setPixelRatio(Math.min(devicePixelRatio,2.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .045;
controls.enablePan = true;
controls.screenSpacePanning = true;
controls.panSpeed = 1.15;
controls.rotateSpeed = .72;
controls.enableZoom = true;
controls.zoomSpeed = 1.35;
controls.minDistance = 2.5;
controls.maxDistance = 110;
controls.minPolarAngle = 0.02;
controls.maxPolarAngle = Math.PI - 0.02;
controls.target.set(0,0,0);

scene.add(new THREE.AmbientLight(0x5f658c,1.15));
const keyLight = new THREE.PointLight(0xffd88b,150,130,2);
keyLight.position.set(10,13,18);
scene.add(keyLight);
const fillLight = new THREE.PointLight(0x879cff,100,100,2);
fillLight.position.set(-18,-8,8);
scene.add(fillLight);

const galaxy = new THREE.Group();
scene.add(galaxy);
const flowersGroup = new THREE.Group();
scene.add(flowersGroup);
const wordGroup = new THREE.Group();
scene.add(wordGroup);
const explosionGroup = new THREE.Group();
scene.add(explosionGroup);

function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function easeOut(v){return 1-Math.pow(1-v,3)}
function makeGlowTexture(){
  const c=document.createElement("canvas"); c.width=c.height=128;
  const x=c.getContext("2d"); const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,"rgba(255,239,166,1)");
  g.addColorStop(.18,"rgba(255,211,86,.9)");
  g.addColorStop(.45,"rgba(255,166,35,.24)");
  g.addColorStop(1,"rgba(255,166,35,0)");
  x.fillStyle=g;x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const glowTexture=makeGlowTexture();

function addStars(){
  const count=9500, pos=new Float32Array(count*3), colors=new Float32Array(count*3);
  const color=new THREE.Color();
  for(let i=0;i<count;i++){
    const r=rand(55,420), a=Math.random()*Math.PI*2, u=rand(-1,1);
    const s=Math.sqrt(1-u*u);
    pos[i*3]=r*s*Math.cos(a); pos[i*3+1]=r*u; pos[i*3+2]=r*s*Math.sin(a);
    color.setHSL(rand(.10,.68),rand(.12,.45),rand(.48,1));
    colors.set([color.r,color.g,color.b],i*3);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  geo.setAttribute("color",new THREE.BufferAttribute(colors,3));
  const mat=new THREE.PointsMaterial({size:.65,vertexColors:true,transparent:true,opacity:.9,depthWrite:false});
  galaxy.add(new THREE.Points(geo,mat));
}
addStars();

function addNebula(){
  for(let i=0;i<18;i++){
    const s=rand(18,42);
    const m=new THREE.SpriteMaterial({map:glowTexture,color:new THREE.Color().setHSL(rand(.08,.7),.55,.35),transparent:true,opacity:rand(.025,.09),blending:THREE.AdditiveBlending,depthWrite:false});
    const sp=new THREE.Sprite(m);
    sp.position.set(rand(-28,28),rand(-20,20),rand(-25,8));
    sp.scale.set(s,s,1);
    galaxy.add(sp);
  }
}
// Nebulosas eliminadas para un fondo limpio.

function createSaturn(){
  const group=new THREE.Group();
  group.rotation.z=-.22;
  group.rotation.x=.13;

  const canvas=document.createElement("canvas"); canvas.width=1024;canvas.height=512;
  const ctx=canvas.getContext("2d");
  const grad=ctx.createLinearGradient(0,0,0,512);
  grad.addColorStop(0,"#6b4b2b");grad.addColorStop(.18,"#d6b57a");grad.addColorStop(.34,"#8d6844");
  grad.addColorStop(.48,"#e1c28b");grad.addColorStop(.63,"#8a6240");grad.addColorStop(.8,"#c7a16b");grad.addColorStop(1,"#4b3527");
  ctx.fillStyle=grad;ctx.fillRect(0,0,1024,512);
  for(let i=0;i<70;i++){
    ctx.globalAlpha=rand(.06,.2);ctx.fillStyle=i%2?"#fff0bd":"#3c271e";
    ctx.fillRect(0,rand(0,512),1024,rand(1,7));
  }
  const texture=new THREE.CanvasTexture(canvas);
  const planet=new THREE.Mesh(new THREE.SphereGeometry(5.05,128,80),new THREE.MeshStandardMaterial({map:texture,roughness:.88,metalness:.03}));
  group.add(planet);

  const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(5.13,96,64),new THREE.MeshBasicMaterial({color:0xf6d58e,transparent:true,opacity:.09,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}));
  group.add(atmosphere);

  const ringGroup=new THREE.Group();
  ringGroup.rotation.x=Math.PI/2.3;
  const ringCount=5200,pos=new Float32Array(ringCount*3),col=new Float32Array(ringCount*3);
  const c=new THREE.Color();
  for(let i=0;i<ringCount;i++){
    const radius=rand(7.0,13.5),angle=Math.random()*Math.PI*2;
    const thickness=rand(-.18,.18);
    pos[i*3]=Math.cos(angle)*radius;
    pos[i*3+1]=Math.sin(angle)*radius;
    pos[i*3+2]=thickness;
    c.setHSL(rand(.07,.13),rand(.18,.55),rand(.45,.9));col.set([c.r,c.g,c.b],i*3);
  }
  const rg=new THREE.BufferGeometry();rg.setAttribute("position",new THREE.BufferAttribute(pos,3));rg.setAttribute("color",new THREE.BufferAttribute(col,3));
  ringGroup.add(new THREE.Points(rg,new THREE.PointsMaterial({size:.065,vertexColors:true,transparent:true,opacity:.88,depthWrite:false})));
  group.add(ringGroup);
  group.userData.rings=ringGroup;
  return group;
}
const saturn=createSaturn();
saturn.position.set(0,0,0);
// Saturno eliminado.

// Small distant planets to make the scene feel like a living galaxy.
function addDistantPlanets(){
  const colors=[0x8f6bce,0x4e9ec7,0xd58b55,0x8fbf86,0xe3b96a,0x9d86d8];
  const positions=[
    [-18,8,-18,1.35], [17,8,-20,1.1], [-20,-7,-18,.9],
    [20,-6,-20,1.25], [-8,13,-25,.72], [9,13,-27,.82],
    [-27,2,-28,.65], [27,3,-30,.72], [0,-13,-25,.8]
  ];
  positions.forEach((v,i)=>{
    const g=new THREE.Group();
    const planet=new THREE.Mesh(
      new THREE.SphereGeometry(v[3],32,20),
      new THREE.MeshStandardMaterial({color:colors[i%colors.length],roughness:.7,metalness:.08})
    );
    g.add(planet);
    if(i%2===0){
      const ring=new THREE.Mesh(
        new THREE.RingGeometry(v[3]*1.35,v[3]*1.65,64),
        new THREE.MeshBasicMaterial({color:0xffd98b,transparent:true,opacity:.45,side:THREE.DoubleSide})
      );
      ring.rotation.x=Math.PI/2.4;
      g.add(ring);
    }
    g.position.set(v[0],v[1],v[2]);
    g.userData.phase=rand(0,Math.PI*2);
    galaxy.add(g);
  });
}
// Planetas eliminados para destacar el espiral y las flores.

function petalMaterial(color){
  return new THREE.MeshPhysicalMaterial({color,roughness:.48,metalness:0,clearcoat:.2,clearcoatRoughness:.35,side:THREE.DoubleSide});
}
function createPetal(){
  const shape=new THREE.Shape();
  shape.moveTo(0,0);
  shape.bezierCurveTo(-.55,.28,-.68,1.12,0,1.65);
  shape.bezierCurveTo(.68,1.12,.55,.28,0,0);
  const geo=new THREE.ExtrudeGeometry(shape,{
    depth:.075,
    bevelEnabled:true,
    bevelSegments:3,
    bevelSize:.045,
    bevelThickness:.035,
    curveSegments:18,
    steps:2
  });
  geo.center();
  const material=petalMaterial(0xffd329);
  material.roughness=.36;
  material.clearcoat=.42;
  material.clearcoatRoughness=.22;
  return new THREE.Mesh(geo,material);
}
function createFlower(scale=1,petals=24){
  const group=new THREE.Group();
  const outer=new THREE.Group();
  for(let i=0;i<petals;i++){
    const p=createPetal();
    const a=i/petals*Math.PI*2;
    p.position.set(Math.cos(a)*.2,Math.sin(a)*.2,0);
    p.rotation.z=a-Math.PI/2;
    p.rotation.x=rand(-.12,.12);
    p.scale.setScalar(scale*rand(.8,1.08));
    outer.add(p);
  }
  group.add(outer);
  const inner=new THREE.Group();
  for(let i=0;i<Math.floor(petals*.65);i++){
    const p=createPetal();
    const a=i/(petals*.65)*Math.PI*2;
    p.position.set(Math.cos(a)*.12,Math.sin(a)*.12,.12);
    p.rotation.z=a-Math.PI/2;
    p.scale.setScalar(scale*rand(.55,.72));
    p.material=petalMaterial(0xffe36b);
    inner.add(p);
  }
  group.add(inner);

  const veinMaterial=new THREE.MeshBasicMaterial({
    color:0xfff0a0,
    transparent:true,
    opacity:.28,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  });
  for(let i=0;i<petals;i+=2){
    const a=i/petals*Math.PI*2;
    const vein=new THREE.Mesh(
      new THREE.PlaneGeometry(scale*.045,scale*1.15),
      veinMaterial
    );
    vein.position.set(Math.cos(a)*scale*.42,Math.sin(a)*scale*.42,.16*scale);
    vein.rotation.z=a-Math.PI/2;
    group.add(vein);
  }

  const center=new THREE.Mesh(new THREE.SphereGeometry(.42*scale,32,24),new THREE.MeshStandardMaterial({color:0x422014,roughness:1}));
  center.scale.set(1,.35,1);center.position.z=.2*scale;group.add(center);
  for(let i=0;i<95;i++){
    const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*.35*scale;
    const seed=new THREE.Mesh(new THREE.SphereGeometry(.025*scale,6,4),new THREE.MeshBasicMaterial({color:i%3?0x9b6a24:0x27160e}));
    seed.position.set(Math.cos(a)*r,Math.sin(a)*r,.38*scale);group.add(seed);
  }
  return group;
}


function createBouquet(scale=1, flowerCount=9){
  const bouquet = new THREE.Group();

  // Stems gathered into a natural fan.
  const stemMaterial = new THREE.MeshStandardMaterial({
    color:0x35552a, roughness:.9, metalness:0
  });
  for(let i=0;i<flowerCount+3;i++){
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(rand(-.45,.45),-3.1,rand(-.18,.18)),
      new THREE.Vector3(rand(-.75,.75),-1.5,rand(-.2,.2)),
      new THREE.Vector3(rand(-1.6,1.6),rand(.4,1.7),rand(-.25,.25))
    ]);
    const stem = new THREE.Mesh(
      new THREE.TubeGeometry(curve,16,.045,8,false),
      stemMaterial
    );
    bouquet.add(stem);
  }

  // Realistic-looking leaves with pointed organic silhouettes.
  const leafMaterial = new THREE.MeshStandardMaterial({
    color:0x58743a, roughness:.8, side:THREE.DoubleSide
  });
  for(let i=0;i<13;i++){
    const leafShape = new THREE.Shape();
    leafShape.moveTo(0,0);
    leafShape.bezierCurveTo(-.42,.12,-.58,.55,0,.95);
    leafShape.bezierCurveTo(.58,.55,.42,.12,0,0);
    const leaf = new THREE.Mesh(
      new THREE.ShapeGeometry(leafShape,10), leafMaterial
    );
    const side = i%2===0 ? -1 : 1;
    leaf.position.set(side*rand(.25,1.5),rand(-2.2,1.2),rand(-.35,.3));
    leaf.rotation.z = side*rand(.55,1.25);
    leaf.rotation.y = rand(-.35,.35);
    leaf.scale.setScalar(rand(.65,1.05));
    bouquet.add(leaf);
  }

  // Layered yellow flowers, with the larger blooms toward the front.
  for(let i=0;i<flowerCount;i++){
    const flowerScale = rand(.52,.86);
    const flower = createFlower(flowerScale, i%3===0 ? 30 : 24);
    const angle = (i/(flowerCount-1)-.5)*Math.PI*.92;
    flower.position.set(
      Math.sin(angle)*rand(1.2,2.45),
      rand(.25,2.35) + Math.cos(angle)*.25,
      Math.cos(angle)*1.1 + rand(-.35,.35)
    );
    flower.rotation.set(rand(-.2,.2),rand(-.35,.35),rand(-.35,.35));
    bouquet.add(flower);
  }

  bouquet.scale.setScalar(scale);
  return bouquet;
}

function addBouquets(){
  const placements = [
    {x:-11,y:2.8,z:-3,s:.95,rot:-.18},
    {x:11,y:2.5,z:-4,s:.9,rot:.2},
    {x:-10,y:-5.2,z:-2,s:.72,rot:.28},
    {x:10,y:-5,z:-3,s:.72,rot:-.25},
    {x:-16,y:7,z:-10,s:.52,rot:-.3},
    {x:16,y:6,z:-11,s:.52,rot:.3},
    {x:-15,y:-8,z:-10,s:.48,rot:.2},
    {x:15,y:-8,z:-11,s:.48,rot:-.2},
    {x:-19,y:3,z:-15,s:.38,rot:-.35},
    {x:19,y:2,z:-16,s:.38,rot:.35},
    {x:-18,y:-10,z:-16,s:.34,rot:.25},
    {x:18,y:-11,z:-17,s:.34,rot:-.25},
    {x:-6,y:10,z:-12,s:.58,rot:-.15},
    {x:6,y:10,z:-13,s:.58,rot:.15},
    {x:-6,y:-10,z:-13,s:.52,rot:.18},
    {x:7,y:-9,z:-14,s:.52,rot:-.18},
    {x:-22,y:8,z:-22,s:.30,rot:-.25},
    {x:22,y:8,z:-23,s:.30,rot:.25},
    {x:-23,y:-4,z:-22,s:.28,rot:.2},
    {x:23,y:-5,z:-23,s:.28,rot:-.2},
    {x:-13,y:11,z:-10,s:.48,rot:-.2},
    {x:13,y:11,z:-11,s:.48,rot:.2},
    {x:-13,y:-11,z:-12,s:.42,rot:.2},
    {x:13,y:-11,z:-13,s:.42,rot:-.2}
  ];

  placements.forEach(item=>{
    const bouquet=createBouquet(item.s,8);
    bouquet.position.set(item.x,item.y,item.z);
    bouquet.rotation.z=item.rot;
    bouquet.userData.base=bouquet.position.clone();
    bouquet.userData.phase=rand(0,Math.PI*2);
    flowersGroup.add(bouquet);
  });

  // Ramo protagonista grande sobre el espiral horizontal.
  const heroBouquet=createBouquet(1.55,13);
  heroBouquet.position.set(0,5.0,1.5);
  heroBouquet.rotation.set(-.12,.12,.02);
  heroBouquet.userData.heroBouquet=true;
  heroBouquet.scale.setScalar(.025);
  flowersGroup.add(heroBouquet);
  return heroBouquet;
}

function arrangeFlowers(){
  const placements=[
    [-12,4,-4,1.2],[-10,-5,-3,.95],[11,5,-5,1.1],[12,-4,-2,1.05],
    [-8,8,-8,.7],[8,8,-7,.8],[-8,-8,-7,.75],[9,-8,-8,.75],
    [-15,0,-8,.65],[15,0,-8,.65]
  ];
  placements.forEach((p,i)=>{
    const f=createFlower(p[3],i%2?22:26);
    f.position.set(p[0],p[1],p[2]);
    f.rotation.set(rand(-.4,.4),rand(-.5,.5),rand(0,Math.PI));
    f.userData.base=f.position.clone();
    f.userData.phase=rand(0,Math.PI*2);
    f.userData.finalScale=1;
    flowersGroup.add(f);
  });
}
arrangeFlowers();
const heroBouquet = addBouquets();

const hero=createFlower(.01,30);
hero.position.set(0,-.4,6.2);
hero.visible=false;
flowersGroup.add(hero);


// Espiral horizontal de partículas doradas en la parte inferior.
function addHorizontalSpiral(){
  // Dibujo de la Vía Láctea: una espiral horizontal dorada en la parte inferior.
  const count=9000;
  const positions=new Float32Array(count*3);
  const colors=new Float32Array(count*3);
  const color=new THREE.Color();

  for(let i=0;i<count;i++){
    const u=Math.random();
    const angle=Math.random()*Math.PI*2;
    const arm=Math.floor(Math.random()*4);
    const radius=Math.pow(u,.72)*11.5;
    const twist=radius*.72;
    const a=angle+twist+arm*Math.PI/2;
    const spread=(1-u)*1.25+.12;
    const x=Math.cos(a)*radius*1.45 + rand(-spread,spread);
    const z=Math.sin(a)*radius*.52 + rand(-spread*.35,spread*.35);
    const y=-3.9 + rand(-.16,.16) + Math.sin(a*2.2)*.12;

    positions[i*3]=x;
    positions[i*3+1]=y;
    positions[i*3+2]=z-1.8;

    color.setHSL(rand(.105,.145),.9,rand(.58,.98));
    colors.set([color.r,color.g,color.b],i*3);
  }

  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.BufferAttribute(positions,3));
  geo.setAttribute("color",new THREE.BufferAttribute(colors,3));
  const mat=new THREE.PointsMaterial({
    map:glowTexture,size:.13,vertexColors:true,transparent:true,
    opacity:.95,depthWrite:false,blending:THREE.AdditiveBlending
  });
  const spiral=new THREE.Points(geo,mat);
  spiral.userData.base=positions.slice();
  galaxy.add(spiral);
  return spiral;
}
const horizontalSpiral=addHorizontalSpiral();

function createYuliParticles(){
  const canvas=document.createElement("canvas");canvas.width=700;canvas.height=190;
  const ctx=canvas.getContext("2d");ctx.fillStyle="white";ctx.font="bold 130px Georgia";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("YULI",350,105);
  const data=ctx.getImageData(0,0,700,190).data;
  const points=[];
  for(let y=0;y<190;y+=4)for(let x=0;x<700;x+=4){
    if(data[(y*700+x)*4+3]>100)points.push([(x-350)/24,(95-y)/24,0]);
  }
  const positions=new Float32Array(points.length*3);
  const starts=new Float32Array(points.length*3);
  for(let i=0;i<points.length;i++){
    positions.set(points[i],i*3);
    const a=Math.random()*Math.PI*2,r=rand(9,27);
    starts[i*3]=Math.cos(a)*r;starts[i*3+1]=rand(-15,15);starts[i*3+2]=Math.sin(a)*r;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.BufferAttribute(starts,3));
  const mat=new THREE.PointsMaterial({map:glowTexture,color:0xffdf72,size:.22,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending});
  const pointsObj=new THREE.Points(geo,mat);
  pointsObj.userData.target=positions;pointsObj.userData.starts=starts;
  wordGroup.add(pointsObj);return pointsObj;
}

function addFloatingPhrases(){
  const phrases=[
    "Feliz día, Yuli ✨",
    "Qué bonito que existas",
    "Solo porque sí",
    "Hoy es un buen día para sonreír",
    "Tu luz es especial",
    "Que nunca te falten motivos para sonreír",
    "Un detalle para ti",
    "Que bonito coincidir contigo",
    "Sigue brillando",
    "Mereces cosas bonitas",
    "Por ser tú",
    "Gracias por existir",
    "Solo por existir",
    "Tu sonrisa ilumina todo",
    "Que la vida te abrace bonito",
    "Eres una luz especial",
    "Hoy todo florece para ti",
    "Gracias por ser tú",
    "Que nunca se apague tu brillo",
    "Un universo para ti",
    "Qué bonito que estés aquí"
  ];
  const canvas=document.createElement("canvas");
  canvas.width=1200; canvas.height=220;
  const ctx=canvas.getContext("2d");
  const group=new THREE.Group();

  phrases.forEach((phrase,i)=>{
    const c=document.createElement("canvas");
    c.width=1100;c.height=150;
    const x=c.getContext("2d");
    x.clearRect(0,0,c.width,c.height);
    x.font='500 70px Georgia';
    x.textAlign="center";x.textBaseline="middle";
    x.fillStyle="#ffe8a0";
    x.shadowColor="#ffc94d";
    x.shadowBlur=13;
    x.fillText(phrase,c.width/2,c.height/2);
    const texture=new THREE.CanvasTexture(c);
    texture.anisotropy=renderer.capabilities.getMaxAnisotropy();
    const sprite=new THREE.Sprite(new THREE.SpriteMaterial({
      map:texture,transparent:true,opacity:.72,
      depthWrite:false,blending:THREE.AdditiveBlending
    }));
    const angle=i/phrases.length*Math.PI*2;
    const radius=rand(13,20);
    sprite.position.set(Math.cos(angle)*radius,rand(-8,9),Math.sin(angle)*radius*.62-3);
    sprite.scale.set(rand(7.8,11.8),1.48,1);
    sprite.userData.phase=rand(0,Math.PI*2);
    group.add(sprite);
  });
  scene.add(group);
  return group;
}
const floatingPhrases=addFloatingPhrases();

const yuli=createYuliParticles();

// A luminous title hovering above Saturn.
function addSaturnTitle(){
  const c=document.createElement("canvas"); c.width=1000; c.height=220;
  const x=c.getContext("2d");
  x.clearRect(0,0,c.width,c.height);
  x.font="600 112px Georgia"; x.textAlign="center"; x.textBaseline="middle";
  x.fillStyle="#fff1a8"; x.shadowColor="#ffd35b"; x.shadowBlur=28;
  x.fillText("YULI",500,112);
  const tex=new THREE.CanvasTexture(c);
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:.94,depthWrite:false,blending:THREE.AdditiveBlending}));
  sprite.position.set(0,7.4,-1.5);
  sprite.scale.set(7.2,1.58,1);
  scene.add(sprite);
  return sprite;
}
const saturnTitle=null;

// Slow golden petals drifting through the scene.
function addFallingPetals(){
  const count=260, pos=new Float32Array(count*3), vel=[];
  for(let i=0;i<count;i++){
    pos[i*3]=rand(-24,24); pos[i*3+1]=rand(-15,16); pos[i*3+2]=rand(-18,10);
    vel.push({x:rand(-.012,.012),y:rand(-.025,-.008),z:rand(-.006,.006),phase:rand(0,Math.PI*2)});
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({color:0xffd85e,size:.075,transparent:true,opacity:.72,depthWrite:false,blending:THREE.AdditiveBlending});
  const pts=new THREE.Points(geo,mat); pts.userData.vel=vel; scene.add(pts); return pts;
}
const fallingPetals=addFallingPetals();

const burstCount=3600;
const burstPos=new Float32Array(burstCount*3),burstVel=new Float32Array(burstCount*3),burstCol=new Float32Array(burstCount*3);
for(let i=0;i<burstCount;i++){
  const a=Math.random()*Math.PI*2, b=Math.acos(rand(-1,1)), speed=rand(.12,.75);
  burstPos.set([0,0,0],i*3);
  burstVel[i*3]=Math.sin(b)*Math.cos(a)*speed;
  burstVel[i*3+1]=Math.cos(b)*speed;
  burstVel[i*3+2]=Math.sin(b)*Math.sin(a)*speed;
  const c=new THREE.Color().setHSL(rand(.09,.15),.8,rand(.55,.9));burstCol.set([c.r,c.g,c.b],i*3);
}
const burstGeo=new THREE.BufferGeometry();burstGeo.setAttribute("position",new THREE.BufferAttribute(burstPos,3));burstGeo.setAttribute("color",new THREE.BufferAttribute(burstCol,3));
const burstMat=new THREE.PointsMaterial({map:glowTexture,size:.24,vertexColors:true,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending});
const burst=new THREE.Points(burstGeo,burstMat);explosionGroup.add(burst);

// A second explosion made of tiny golden flower petals.
const petalBurstCount=900;
const petalBurstPos=new Float32Array(petalBurstCount*3);
const petalBurstVel=new Float32Array(petalBurstCount*3);
for(let i=0;i<petalBurstCount;i++){
  const a=Math.random()*Math.PI*2, b=Math.acos(rand(-1,1)), speed=rand(.08,.5);
  petalBurstVel[i*3]=Math.sin(b)*Math.cos(a)*speed;
  petalBurstVel[i*3+1]=Math.cos(b)*speed;
  petalBurstVel[i*3+2]=Math.sin(b)*Math.sin(a)*speed;
}
const petalBurstGeo=new THREE.BufferGeometry();
petalBurstGeo.setAttribute("position",new THREE.BufferAttribute(petalBurstPos,3));
const petalBurstMat=new THREE.PointsMaterial({color:0xffd329,size:.12,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending});
const petalBurst=new THREE.Points(petalBurstGeo,petalBurstMat);
explosionGroup.add(petalBurst);

const shock=new THREE.Mesh(new THREE.RingGeometry(.08,.16,96),new THREE.MeshBasicMaterial({color:0xffe18a,transparent:true,opacity:0,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));
shock.rotation.x=Math.PI/2;scene.add(shock);

let started=false,startTime=0;
$("enter").addEventListener("click",()=>{
  if(started)return;started=true;startTime=clock.getElapsedTime();
  const musica=$("musicaFondo"); if(musica){musica.volume=0.55; musica.play().catch(()=>{});}
  $("intro").style.opacity="0";setTimeout(()=>$("intro").remove(),1500);
  $("hud").style.opacity="1";$("hint").style.opacity="1";
  setTimeout(()=>$("message").style.opacity="1",10500);
  if(window.AudioContext||window.webkitAudioContext){try{const ac=new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator();const g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(110,ac.currentTime);o.frequency.exponentialRampToValueAtTime(440,ac.currentTime+1.5);g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.08,ac.currentTime+.08);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+2);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+2.1)}catch(e){}}
});

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  const elapsed=started?Math.max(0,t-startTime):0;
  const reveal=clamp((elapsed-1.5)/6.5,0,1);
  const e=easeOut(reveal);
  const sp=horizontalSpiral.geometry.attributes.position.array;
  const base=horizontalSpiral.userData.base;
  for(let i=0;i<sp.length;i+=3){
    const wave=Math.sin(t*.8+i*.002)*.035;
    sp[i]=base[i];
    sp[i+1]=base[i+1]+wave;
    sp[i+2]=base[i+2]+Math.cos(t*.6+i*.001)*.025;
  }
  horizontalSpiral.geometry.attributes.position.needsUpdate=true;

  galaxy.children.forEach((obj,i)=>{
    if(obj.userData && obj.userData.phase!==undefined){
      obj.rotation.y += .0015;
      obj.position.y += Math.sin(t*.22+obj.userData.phase)*.0007;
    }
  });
  const fp=fallingPetals.geometry.attributes.position.array;
  fallingPetals.userData.vel.forEach((v,i)=>{
    const k=i*3;
    fp[k]+=v.x+Math.sin(t*.4+v.phase)*.002;
    fp[k+1]+=v.y;
    fp[k+2]+=v.z;
    if(fp[k+1]<-17){fp[k+1]=17;fp[k]=rand(-24,24);fp[k+2]=rand(-18,10);}
  });
  fallingPetals.geometry.attributes.position.needsUpdate=true;
  flowersGroup.rotation.y=Math.sin(t*.08)*.08;
  floatingPhrases.rotation.y=t*.012;
  floatingPhrases.children.forEach((s,i)=>{
    s.position.y += Math.sin(t*.35+s.userData.phase)*.0018;
    s.material.opacity=.42+Math.sin(t*.5+s.userData.phase)*.12;
  });
  flowersGroup.children.forEach((f,i)=>{
    if(f===hero || f.userData.heroBouquet)return;
    const b=f.userData.base;
    if(b){
      f.position.y=b.y+Math.sin(t*.35+f.userData.phase)*.35;
    }
    f.rotation.y+=.0015;
  });

  heroBouquet.scale.setScalar(.025+e*1.18);
  heroBouquet.position.y=-.6+Math.sin(t*.42)*.14;
  heroBouquet.rotation.y=.12+Math.sin(t*.2)*.08;

  hero.scale.setScalar(.02+e*.98);
  hero.rotation.y=t*.12;
  hero.position.y=-.4+Math.sin(t*.5)*.18;

  const bp=burst.geometry.attributes.position.array;
  for(let i=0;i<burstCount;i++){
    const k=i*3;
    const age=clamp(elapsed/4.4,0,1.4);
    bp[k]=burstVel[k]*elapsed*18*(1+age*.35);
    bp[k+1]=burstVel[k+1]*elapsed*18*(1+age*.35);
    bp[k+2]=burstVel[k+2]*elapsed*18*(1+age*.35);
  }
  burst.geometry.attributes.position.needsUpdate=true;
  burst.material.opacity=started?clamp(1-elapsed/4.5,0,1):0;

  const pp=petalBurst.geometry.attributes.position.array;
  const petalAge=clamp(elapsed/5.8,0,1.4);
  for(let i=0;i<petalBurstCount;i++){
    const k=i*3;
    pp[k]=petalBurstVel[k]*elapsed*20*(1+petalAge*.25);
    pp[k+1]=petalBurstVel[k+1]*elapsed*20*(1+petalAge*.25);
    pp[k+2]=petalBurstVel[k+2]*elapsed*20*(1+petalAge*.25);
  }
  petalBurst.geometry.attributes.position.needsUpdate=true;
  petalBurst.material.opacity=started?clamp(1-elapsed/5.8,0,1):0;

  shock.scale.setScalar(.1+clamp(elapsed/2.6,0,1)*30);
  shock.material.opacity=started?Math.max(0,.8-elapsed/2.6):0;

  const wordP=clamp((elapsed-6.0)/4.0,0,1);
  const wp=easeOut(wordP);
  const pos=yuli.geometry.attributes.position.array, target=yuli.userData.target, starts=yuli.userData.starts;
  for(let i=0;i<pos.length;i++)pos[i]=starts[i]+(target[i]-starts[i])*wp;
  yuli.geometry.attributes.position.needsUpdate=true;
  yuli.material.opacity=wp*.95;

  const camPulse=elapsed<2.2?Math.sin(elapsed*9)*(.8*(1-elapsed/2.2)):0;
  camera.position.z=38-camPulse;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
$("loading").textContent="LISTO · EL UNIVERSO TE ESTÁ ESPERANDO";
</script>
